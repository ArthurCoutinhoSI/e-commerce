name: ecommerce

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ecommerce_db_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ecommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  product-service:
    build:
      context: ./product-service
    image: ecommerce/product-service:local
    environment:
      NODE_ENV: production
      PORT: 3001
      PGHOST: database
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-ecommerce}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATABASE: products
    networks:
      - ecommerce
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    init: true
    stop_grace_period: 10s

  payment-service:
    build:
      context: ./payment-service
    image: ecommerce/payment-service:local
    environment:
      NODE_ENV: production
      PORT: 3002
      PRODUCT_SERVICE_URL: http://product-service:3001
      PGHOST: database
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-ecommerce}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATABASE: payments
    networks:
      - ecommerce
    depends_on:
      database:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    init: true
    stop_grace_period: 10s

  api-gateway:
    build:
      context: ./api-gateway
    image: ecommerce/api-gateway:local
    environment:
      NODE_ENV: production
      PORT: 8080
      PRODUCT_SERVICE_URL: http://product-service:3001
      PAYMENT_SERVICE_URL: http://payment-service:3002
    ports:
      - "8080:8080"
    networks:
      - ecommerce
    depends_on:
      product-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    init: true
    stop_grace_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=1GB'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ecommerce
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    init: true
    stop_grace_period: 10s

networks:
  ecommerce:
    driver: bridge

volumes:
  ecommerce_db_data:
  prometheus_data:
