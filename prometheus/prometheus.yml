global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: product-service
    metrics_path: /metrics
    static_configs:
      - targets: ['product-service:3001']

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ['payment-service:3002']